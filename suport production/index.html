<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Grid Map - Interactive</title>
    <!-- CDN Icon: Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LAYER 2: Overlay Tombol Pin/Marker (UI Overlay / Lapisan Tombol) -->
    <div id="ui-overlay" class="layer-btn-overlay"></div>

    <!-- TOOLBAR: Kontrol Navigasi Kamera Pojok Bawah (Bottom Camera Controls / Tombol Navigasi) -->
    <div id="cam-ctrl-panel" class="panel-nav-ctrl">
        <button class="ctrl-btn" title="Perbesar (Zoom In)" onclick="zoomIn()">
            <i data-lucide="zoom-in"></i>
        </button>
        <button class="ctrl-btn" title="Perkecil (Zoom Out)" onclick="zoomOut()">
            <i data-lucide="zoom-out"></i>
        </button>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" title="Pas Layar (Fit View)" onclick="fitView()">
            <i data-lucide="maximize-2"></i>
        </button>
        <button class="ctrl-btn" title="Pusatkan Fokus (Focus Target)" onclick="focusCurrentTarget()">
            <i data-lucide="crosshair"></i>
        </button>
    </div>

    <!-- LAYER 1: Canvas Tiga Dimensi / Peta Grid (3D WebGL Canvas / Peta Latar) -->
    <div id="map" class="layer-map-canvas"></div>

    <!-- SCRIPT & KONFIGURASI TERPISAH (Modular Scripts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 1. Konfigurasi Ukuran & Dimensi Grid (Jumlah Kolom/Baris) -->
    <script src="config-grid.js"></script>
    <!-- 2. Konfigurasi Jumlah & Titik Tombol Site (Pin & Data Bar) -->
    <script src="config-points.js"></script>
    <!-- 3. Konfigurasi Tema & Warna 3D -->
    <script src="theme-styles.js"></script>
    <!-- 4. Engine Utama Logika & Render -->
    <script src="script.js"></script>
    <script>
        // Render semua ikon dari Lucide
        lucide.createIcons();
    </script>
</body>
</html>
