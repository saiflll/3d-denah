<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Grid Map - Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">

<body>

    <!-- LOCK SCREEN MINIMALIS ANALYST / BACKEND (Terminal Minimalist Auth) -->
    <div id="auth-lock-screen" class="lock-screen-overlay">
        <div class="lock-card">
            <div class="pin-display-group">
                <span class="lock-dot"></span>
                <span class="pin-prompt">&gt;</span>
                <input type="password" id="pin-input" maxlength="8" placeholder="ENTER ACCESS KEY" autocomplete="off"
                    autofocus onkeydown="if(event.key==='Enter') verifyPin()">
                <button class="pin-submit-btn" title="Submit" onclick="verifyPin()">
                    <i data-lucide="corner-down-left"></i>
                </button>
            </div>
            <div id="lock-error-msg" class="lock-error">ACCESS DENIED &bull; INVALID KEY</div>
        </div>
    </div>

    <!-- TAB KATEGORI KIRI BAWAH (Compact Vertical Stacked HUD) -->
    <div id="category-tab-panel" class="panel-category-tabs vertical-stack">
        <button class="cat-tab-btn active" data-category="produksi" onclick="switchCategory('produksi')">
            <span class="cat-dot"></span>
            <span class="cat-name">PRODUKSI</span>
        </button>
        <div class="cat-divider-line"></div>
        <button class="cat-tab-btn" data-category="support" onclick="switchCategory('support')">
            <span class="cat-dot"></span>
            <span class="cat-name">SUPPORT</span>
        </button>
    </div>

    <!-- LAYER 2 -->
    <div id="ui-overlay" class="layer-btn-overlay"></div>

    <!-- TOOLBAR -->
    <div id="cam-ctrl-panel" class="panel-nav-ctrl">
        <button class="ctrl-btn" title="Perbesar (Zoom In)" onclick="zoomIn()">
            <i data-lucide="zoom-in"></i>
        </button>
        <button class="ctrl-btn" title="Perkecil (Zoom Out)" onclick="zoomOut()">
            <i data-lucide="zoom-out"></i>
        </button>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" title="Pas Layar (Fit View)" onclick="fitView()">
            <i data-lucide="maximize-2"></i>
        </button>
        <button class="ctrl-btn" title="Pusatkan Fokus (Focus Target)" onclick="focusCurrentTarget()">
            <i data-lucide="crosshair"></i>
        </button>
    </div>

    <!-- LAYER 1 -->
    <div id="map" class="layer-map-canvas"></div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="config-grid.js"></script>
    <script src="config-points.js"></script>
    <script src="theme-styles.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
